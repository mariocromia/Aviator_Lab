<!doctype html>
<html lang="pt-BR" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#0b0e11" />
    <title>Aviator Strategy Lab</title>
    <style>
      html, body, #root { width: 100%; min-height: 100%; margin: 0; background: #0b0e11; }
      #boot-shell { min-height: 100vh; display: grid; place-items: center; color: #dbe4ef; font: 500 13px Inter, ui-sans-serif, system-ui, sans-serif; }
      #boot-shell > div { display: grid; justify-items: center; gap: 14px; }
      #boot-spinner { width: 38px; height: 38px; border: 3px solid #263243; border-top-color: #3b82f6; border-radius: 50%; animation: boot-spin .8s linear infinite; box-shadow: 0 0 20px rgba(59,130,246,.18); }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
    </style>
  </head>
  <body><div id="root"><div id="boot-shell"><div><div id="boot-spinner"></div><span>Carregando a interface...</span></div></div></div><script type="module" src="/src/main.tsx"></script></body>
</html>
